[project]
name = "argocd-tenant-migrator"
version = "0.1.0"
description = "CLI tool to migrate ArgoCD ApplicationSets from SCM Generators to Git Generators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "jsonschema>=4.20.0",
]

[project.scripts]
argocd-migrator = "argocd_migrator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argocd_migrator"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]
